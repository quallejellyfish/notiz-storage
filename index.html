<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notiz Storage</title>
    <style>
      :root {
        --bg-color: #ffffff;
        --border-color: #333333;
        --tile-hover: #f0f0f0;
        --text-main: #333333;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      .top-nav {
        width: 100%;
        max-width: 1000px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      .back-btn {
        font-size: 1.2rem;
        background: none;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        padding: 5px 15px;
        cursor: pointer;
        display: none;
      }

      .back-btn:hover {
        background-color: var(--tile-hover);
      }

      h1,
      h2,
      h3 {
        margin: 0;
        text-align: center;
        font-weight: normal;
      }

      .tile-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        max-width: 1000px;
        width: 100%;
      }

      .tile {
        border: 2px solid var(--border-color);
        border-radius: 12px;
        padding: 30px 20px;
        min-width: 150px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 1.5rem;
        background-color: white;
        box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
      }

      .tile:hover {
        background-color: var(--tile-hover);
        transform: translateY(-2px);
        box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1);
      }

      .tile.large {
        width: 100%;
        max-width: 300px;
        padding: 50px 20px;
      }
      .tile.medium {
        width: 150px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tile.small {
        width: 120px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .content-view {
        display: none;
        width: 100%;
        max-width: 800px;
        border: 2px solid var(--border-color);
        border-radius: 12px;
        padding: 30px;
        box-sizing: border-box;
        background-color: white;
        box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1);
        line-height: 1.6;
      }

      .content-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        font-size: 1.5rem;
        border-bottom: 2px dashed #ccc;
        padding-bottom: 10px;
      }

      .generator-toggle {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--border-color);
        color: white;
        border: none;
        padding: 15px 25px;
        border-radius: 50px;
        font-size: 1.2rem;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }

      .generator-panel {
        display: none;
        position: fixed;
        bottom: 80px;
        right: 20px;
        width: 350px;
        background: white;
        border: 2px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        z-index: 100;
      }

      .generator-panel input,
      .generator-panel textarea,
      .generator-panel select {
        width: 100%;
        margin-bottom: 15px;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      .generator-panel button {
        width: 100%;
        padding: 10px;
        background: var(--border-color);
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1.2rem;
      }

      .json-output {
        display: none;
        width: 100%;
        height: 150px;
        margin-top: 10px;
        font-size: 0.8rem;
        background: #f5f5f5;
        padding: 10px;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="top-nav">
      <button id="back-btn" class="back-btn">← Zurück</button>
      <h1 id="page-title">Ladet Lädt...</h1>
      <div style="width: 80px"></div>
    </div>

    <div id="tile-container" class="tile-container"></div>

    <div id="content-view" class="content-view">
      <div class="content-header">
        <div id="content-tile">LF 1</div>
        <div id="content-data">blabla</div>
      </div>
      <div class="content-body"></div>
    </div>

    <button id="toggle-generator" class="generator-toggle">Neue Notizen</button>

    <div id="generator-panel" class="generator-panel">
      <h3 style="margin-bottom: 15px">Daten Eingebung</h3>

      <label></label>
      <select id="gen-parent"></select>
      <label></label>
      <input type="text" id="gen-title" placeholder="Kopfzeile des Kachel" />
      <label></label>
      <input type="text" id="gen-date" placeholder="Datum, z.B. 1. März" />
      <label></label>
      <textarea
        id="gen-content"
        rows="4"
        placeholder="Notizen, Stichpunkte, etc..."
      ></textarea>

      <button onclick="submitNewData()">Speicherung zur Datenbank</button>
      <div id="status-msg" class="status-msg"></div>
    </div>
    <script>
      let db = {};
      let currentPath = [];
      let isGeneratorOpen = false;

      const tileContainer = document.getElementById("tile-container");
      const contentView = document.getElementById("content-view");
      const pageTitle = document.getElementById("page-title");
      const backBtn = document.getElementById("back-btn");
      const contentTitle = document.getElementById("content-title");
      const contentDate = document.getElementById("content-date");
      const contentBody = document.getElementById("content-body");

      const toggleGenBtn = document.getElementById("toggle-generator");
      const genPanel = document.getElementById("generator-panel");
      const statusMsg = document.getElementById("status-msg");

      async function loadData() {
        try {
          pageTitle.innerText = "ladet lädt...";
          const res = await fetch("/api/data");
          db = await res.json();

          const select = document.getElementById("gen-parent");
          select.innerHTML = "";
          populateParentDropdown(db);

          currentPath = [];
          renderScreen();
        } catch (err) {
          pageTitle.innerText = "Fehler beim Laden der Daten";
          console.error(err);
        }
      }

      function populateParentDropdown(node, prefix = "") {
        const select = document.getElementById("gen-parent");
        const option = document.getElementById("option");
        option.value = node.id;
        option.innerText = prefix + node.title;

        if (node.children) {
          node.children.forEach((child) =>
            populateParentDropdown(child, prefix + " > "),
          );
        }
      }

      function renderScreen() {
        tileContainer.innerHTML = "";
        contentView.style.display = "none";
        tileContainer.style.display = "flex";
        backBtn.style.display = currentPath.length > 0 ? "block" : "none";

        let currentFolder = db;
        for (let id of currentPath) {
          if (currentFolder.cildren) {
            currentFolder = currentFolder.children.find((c) => c.id === id);
          }
        }

        pageTitle.innerText =
          currentPath.length === 0 ? "Notiz Storage" : currentFolder.title;

        if (currentFolder.content !== undefined) {
          showContentView(currentFolder);
          return;
        }

        if (currentFolder.children && currentFolder.children.length > 0) {
          currentFolder.children.forEach((child) => {
            const tile = document.createElement("div");
            if (currentPath.length === 0) tile.className = "tile large";
            else if (currentPath.length === 1) tile.className = "tile medium";
            else tile.className = "tile small";

            tile.innerText = child.title;
            tile.onclick = () => navigateTo(child.id);
            tileContainer.appendChild(tile);
          });
        } else {
          tileContainer.innerHTML =
            "<p color:#888;>Bis jetzt gibt es keine Notizen verfügbar. Fügen Sie eine neue Notiz zu.</p>";
        }
      }

      function navigateTo(id) {
        currentPath.push(id);
        renderScreen();
      }

      backBtn.onclick = () => {
        currentPath.pop();
        renderScreen();
      };

      function showContentView(data) {
        tileContainer.style.display = "none";
        contentView.style.display = "block";
        contentTitle.innerText = data.title;
        contentDate.innerText = data.date || "";
        contentBody.innerHTML = data.content || "<p>Noch kein Kontent verfügbar.</p>";
      }

      toggleGenBtn.onclick = () => {
        isGeneratorOpen = !isGeneratorOpen;
        genPanel.style.display = isGeneratorOpen ? "block" : "none";
        statusMsg.innerText = "";
      };

      async function submitNewData() {
        const parentId = document.getElementById("gen-parent").value;
        const title = document.getElementById("gen-title").value;
        const date = document.getElementById("gen-date").value;
        const content = document.getElementById("gen-content").value;

        if (!title) return alert("Bitte eine Kopfzeile einfügen!");

        const newId =
          title.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + Date.now();

        let newObj = { id: newId, title: title };
        if (content || date) {
          newObj.date = date;
          newObj.content = content;
        } else {
          newObj.children = [];
        }

        statusMsg.style.color = "blue";
        statusMsg.innerText = "Speicherung zu GitHub...";

        try {
          const response = await fetch("/api/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ parentId, newData: newObj }),
          });

          const result = await response.json();
          if (result.success) {
            statusMsg.style.color = "green";
            statusMsg.innerText = "Erfolgreiche GitHub Speicherung";

            document.getElementById("gen-title").value = "";
            document.getElementById("gen-content").value = "";

            await loadData();
          } else {
            statusMsg.style.color = "red";
            statusMsg.innerText = "Fehler: " + result.error;
          }
        } catch (error) {
          statusMsg.style.color = "red";
          statusMsg.innerText = "Serververbindungsfehler";
        }
      }

      loadData()
    </script>
  </body>
</html>
